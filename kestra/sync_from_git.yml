id: sync_syntra_dw
namespace: syntra.ops

concurrency:
  limit: 1

tasks:
  - id: sync_sql
    type: io.kestra.plugin.git.SyncNamespaceFiles
    kestraUrl: http://localhost:8080
    auth:
      username: "{{ secret('KESTRA_API_USERNAME') }}"
      password: "{{ secret('KESTRA_API_PASSWORD') }}"
    url: https://github.com/charliegu-star/syntra_dw.git
    branch: main
    username: charliegu-star
    password: "{{ secret('GITHUB_ACCESS_TOKEN') }}"
    namespace: syntra.dw
    gitDirectory: kestra/files

  - id: sync_flows
    type: io.kestra.plugin.git.SyncFlows
    kestraUrl: http://localhost:8080
    auth:
      username: "{{ secret('KESTRA_API_USERNAME') }}"
      password: "{{ secret('KESTRA_API_PASSWORD') }}"
    url: https://github.com/charliegu-star/syntra_dw.git
    branch: main
    username: charliegu-star
    password: "{{ secret('GITHUB_ACCESS_TOKEN') }}"
    targetNamespace: syntra.dw
    gitDirectory: kestra/flows

triggers:
  - id: poll_git
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/2 * * * *"
