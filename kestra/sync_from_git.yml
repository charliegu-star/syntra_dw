id: sync_syntra_dw
namespace: syntra.ops

concurrency:
  limit: 1

tasks:
  - id: sync_sql
    type: io.kestra.plugin.git.SyncNamespaceFiles
    url: https://github.com/YOUR_ORG/syntra_dw.git
    branch: main
    username: YOUR_GITHUB_USER
    password: "{{ secret('GITHUB_ACCESS_TOKEN') }}"
    namespace: syntra.dw
    gitDirectory: kestra/files

  - id: sync_flows
    type: io.kestra.plugin.git.SyncFlows
    url: https://github.com/YOUR_ORG/syntra_dw.git
    branch: main
    username: YOUR_GITHUB_USER
    password: "{{ secret('GITHUB_ACCESS_TOKEN') }}"
    targetNamespace: syntra.dw
    gitDirectory: kestra/flows

triggers:
  - id: poll_git
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/2 * * * *"
