id: order_warehouse
namespace: syntra.dw

concurrency:
  limit: 1

tasks:
  - id: refresh_order_warehouse
    type: io.kestra.plugin.core.flow.Dag
    tasks:
      - task:
          id: dwd_order_detail
          type: io.kestra.plugin.jdbc.mysql.Queries
          url: "{{ secret('DW_JDBC_URL') }}"
          username: "{{ secret('DW_MYSQL_USERNAME') }}"
          password: "{{ secret('DW_MYSQL_PASSWORD') }}"
          transaction: true
          sql: "{{ read('sql/dwd_order_detail.sql') }}"

      - task:
          id: dws_user_order_day
          type: io.kestra.plugin.jdbc.mysql.Queries
          url: "{{ secret('DW_JDBC_URL') }}"
          username: "{{ secret('DW_MYSQL_USERNAME') }}"
          password: "{{ secret('DW_MYSQL_PASSWORD') }}"
          transaction: true
          sql: "{{ read('sql/dws_user_order_day.sql') }}"
        dependsOn:
          - dwd_order_detail

      - task:
          id: ads_user_report
          type: io.kestra.plugin.jdbc.mysql.Queries
          url: "{{ secret('DW_JDBC_URL') }}"
          username: "{{ secret('DW_MYSQL_USERNAME') }}"
          password: "{{ secret('DW_MYSQL_PASSWORD') }}"
          transaction: true
          sql: "{{ read('sql/ads_user_report.sql') }}"
        dependsOn:
          - dws_user_order_day

triggers:
  - id: daily_refresh
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    timezone: Asia/Shanghai
    disabled: true
